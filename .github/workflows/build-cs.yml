name: Build and Test (C#)

on:
  push:
    branches: [develop_cs, develop]
  pull_request:
    branches: [develop_cs, develop]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (Central Package Management)
        run: dotnet restore Qapptia.sln

      - name: Build
        run: dotnet build Qapptia.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Qapptia.sln --configuration Release --no-build --verbosity normal
