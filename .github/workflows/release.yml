name: Build and Release

on:
  push:
    tags:
      - 'v*' # Se activa con tags como v1.0.0, v1.0.0-beta.1, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: python build.py --version ${{ github.ref_name }}

      - name: Get App Name
        shell: pwsh
        run: |
          $name = python -c "from core.version import APP_NAME; print(APP_NAME)"
          echo "APP_NAME=$name" >> $env:GITHUB_ENV

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: releases/${{ env.APP_NAME }}-v*.zip
          draft: false
          prerelease: contains(github.ref, 'alpha') || contains(github.ref, 'beta')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
